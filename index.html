<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proficient English</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container">
    <h1>Proficient English</h1>
    <button id="startRecordBtn">Start Recording</button>
    <button id="stopRecordBtn" disabled>Stop Recording</button>
    <h3>Feedback:</h3>
    <div id="feedback">
      <p id="fluencyFeedback">Fluency: Not assessed yet</p>
      <p id="vocabularyFeedback">Vocabulary: Not assessed yet</p>
      <p id="pronunciationFeedback">Pronunciation: Not assessed yet</p>
      <p id="grammarFeedback">Grammar: Not assessed yet</p>
      <p id="scoreFeedback">Score: Not assessed yet</p>
    </div>
    <div id="output" class="output"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
